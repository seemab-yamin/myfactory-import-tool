{% extends "base.html" %}
{% block title %}Mappings{% endblock %}
{% block content %}        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="bi bi-diagram-3"></i> Mapping Management</h4>
            <div>
                <button class="btn btn-sm btn-outline-primary" onclick="refreshAll()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
                <button class="btn btn-sm btn-success" onclick="showAddModal()">
                    <i class="bi bi-plus-circle"></i> Add Mapping
                </button>
            </div>
        </div>

        <!-- Search -->
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control form-control-sm search-box" 
                   placeholder="Search supplier or field..." oninput="filterMappings()">
        </div>

        <!-- Mappings Container -->
        <div id="mappingsContainer">
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Loading mappings...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="mappingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Mapping</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="mappingForm">
                        <input type="hidden" id="editSupplier" value="">
                        <input type="hidden" id="editSource" value="">
                        
                        <div class="mb-3">
                            <label class="form-label">Supplier Name</label>
                            <input type="text" class="form-control" id="modalSupplier" 
                                   placeholder="e.g., ACME" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Source Field (CSV column)</label>
                            <input type="text" class="form-control" id="modalSource" 
                                   placeholder="e.g., SKU" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target Field (Database column)</label>
                            <input type="text" class="form-control" id="modalTarget" 
                                   placeholder="e.g., ProductNumber" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="modalActive" checked>
                            <label class="form-check-label">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveMapping()">
                        <i class="bi bi-save"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Delete mapping <strong id="deleteSource"></strong> for supplier <strong id="deleteSupplier"></strong>?</p>
                    <p class="text-muted small">This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', path='js/mappings.js') }}"></script>

{% endblock %}
