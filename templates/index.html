<!DOCTYPE html>
<html>
  <head>
    <title>MyFactory Import Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        font-family: Arial;
        max-width: 900px;
        margin: 40px auto;
      }
      .container {
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .form-group {
        margin: 10px 0;
      }
      label {
        display: inline-block;
        width: 100px;
      }
      input,
      select {
        padding: 5px;
        width: 300px;
      }
      button {
        padding: 8px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .result {
        margin-top: 20px;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 4px;
        max-height: 400px;
        overflow-y: auto;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      .info {
        color: blue;
      }
      .nav-links {
        margin-bottom: 20px;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .nav-links a {
        margin-right: 20px;
        text-decoration: none;
        color: #007bff;
      }
      .nav-links a:hover {
        text-decoration: underline;
      }
      pre {
        background: #f1f1f1;
        padding: 10px;
        border-radius: 4px;
        max-height: 300px;
        overflow-y: auto;
        font-size: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Navigation -->
      <div class="nav-links">
        <a href="/">🏠 Home</a>
        <a href="/schema">📊 View Schema</a>
        <a href="/docs">📚 API Docs</a>
      </div>

      <h1>🚀 MyFactory Import Tool</h1>
      <p>Upload CSV/Excel files and import to Myfactory CRM</p>

      <div id="status"></div>

      <div class="form-group">
        <label>File:</label>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" />
      </div>

      <div class="form-group">
        <label>Supplier:</label>
        <input type="text" id="supplierInput" value="default" placeholder="Supplier name" />
      </div>

      <div class="form-group">
        <label>Dry run:</label>
        <input type="checkbox" id="dryRunInput" checked />
      </div>

      <button onclick="uploadFile()">Upload & Import</button>
      <button onclick="clearResult()" style="background: #6c757d; margin-left: 10px;">Clear</button>

      <div id="result" class="result">
        <p class="text-muted">Ready to import...</p>
      </div>

      <!-- Status indicator -->
      <div id="connectionStatus" style="margin-top: 15px; font-size: 14px;"></div>
    </div>

    <script>
      // Check connection status on load
      async function checkConnection() {
        const statusDiv = document.getElementById('connectionStatus')
        try {
          const response = await fetch('/health')
          const data = await response.json()
          if (data.configured) {
            statusDiv.innerHTML = '<span style="color: green;">✅ Connected to database</span>'
          } else {
            statusDiv.innerHTML = '<span style="color: orange;">⚠️ Database not configured. Run setup first.</span>'
          }
        } catch (e) {
          statusDiv.innerHTML = '<span style="color: red;">❌ Cannot connect to API server</span>'
        }
      }
      
      async function uploadFile() {
        const fileInput = document.getElementById('fileInput')
        const supplier = document.getElementById('supplierInput').value.trim() || 'default'
        const dryRun = document.getElementById('dryRunInput').checked
        const resultDiv = document.getElementById('result')
      
        if (!fileInput.files.length) {
          resultDiv.innerHTML = '<div class="error">❌ Please select a file</div>'
          return
        }
      
        const file = fileInput.files[0]
        const formData = new FormData()
        formData.append('file', file)
        formData.append('supplier', supplier)
        formData.append('dry_run', dryRun)
        formData.append('batch_size', 1000)
      
        resultDiv.innerHTML = '<div class="info">⏳ Uploading...</div>'
      
        try {
          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          })
      
          const data = await response.json()
      
          if (response.ok) {
            let html = '<div class="success">✅ Import completed successfully!</div>'
            html += `<pre>${JSON.stringify(data, null, 2)}</pre>`
            resultDiv.innerHTML = html
      
            // Show preview if dry run
            if (data.preview && data.preview.length > 0) {
              resultDiv.innerHTML += '<h5>Preview Data:</h5>'
              resultDiv.innerHTML += `<pre>${JSON.stringify(data.preview, null, 2)}</pre>`
            }
          } else {
            let errorMsg = data.detail || 'Unknown error'
            if (typeof errorMsg === 'object') {
              errorMsg = JSON.stringify(errorMsg, null, 2)
            }
            resultDiv.innerHTML = `<div class="error">❌ Error: ${errorMsg}</div>`
          }
        } catch (e) {
          resultDiv.innerHTML = `<div class="error">❌ Network Error: ${e.message}</div>`
        }
      }
      
      function clearResult() {
        document.getElementById('result').innerHTML = '<p class="text-muted">Ready to import...</p>'
        document.getElementById('fileInput').value = ''
      }
      
      // Auto-check connection on load
      checkConnection()
    </script>
  </body>
</html>
