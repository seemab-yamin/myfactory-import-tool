{% extends 'base.html' %}
{% block title %}
  Home - MyFactory Import Tool
{% endblock %}
{% block content %}
  <h1>🚀 MyFactory Import Tool</h1>
  <p>Upload CSV/Excel files and import to Myfactory CRM</p>

  <div id="status"></div>

  <div class="form-group">
    <label>File:</label>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" />
  </div>
  <div class="form-group">
    <label>Supplier:</label>
    <select id="supplierInput" class="form-select" style="width:auto; display:inline-block;">
      {% for id, name in suppliers %}
        <option value="{{ id }}">{{ name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Dry run:</label>
    <input type="checkbox" id="dryRunInput" checked />
  </div>

  <button onclick="uploadFile()" class="btn btn-primary">Upload & Import</button>
  <button onclick="clearResult()" class="btn btn-secondary" style="margin-left:10px;">Clear</button>

  <div id="result" class="result">
    <p class="text-muted">Ready to import...</p>
  </div>

  <div id="connectionStatus" style="margin-top:15px; font-size:14px;"></div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='js/main.js') }}"></script>
  <script src="{{ url_for('static', path='js/index.js') }}"></script>
{% endblock %}
