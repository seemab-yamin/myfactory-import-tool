{% extends 'base.html' %}
{% block title %}
  Home - MyFactory Import Tool
{% endblock %}
{% block content %}
  <h1>🚀 MyFactory Import Tool</h1>
  <p>Upload CSV/Excel files and import to Myfactory CRM</p>

  <div id="status"></div>

  <div class="form-group">
  <label for="supplierInput">Supplier:</label>
  <select id="supplierInput" class="form-select" style="width:auto; display:inline-block;">
    <option value="">— select —</option>
    {% for s in suppliers %}
      <option value="{{ s[0] }}"
              data-supplier-id="{{ s[0] }}"
              data-supplier-name="{{ s[1] }}"
              data-header-row-index="{{ s[8] if s[8] is not none else 1 }}"
              data-sheet-name="{{ s[9] or '' }}"
              data-delimiter="{{ s[10] or ',' }}">
        {{ s[1] }}
      </option>
    {% endfor %}
  </select>

  <!-- ✅ Config hint (populated by JS) -->
  <div id="supplierConfigHint" class="mt-2" style="display:none;"></div>
</div>

  <div class="form-group">
  <label for="fileInput">File:</label>
  <input type="file"
         id="fileInput"
         class="form-control"
         accept=".csv,.xlsx,.xls"
         disabled>

  <!-- ✅ New: gate hint (populated by JS) -->
  <div id="fileGateHint" class="mt-1"></div>
</div>

  <div class="form-group">
    <label>Dry run:</label>
    <input type="checkbox" id="dryRunInput" checked />
    <label for="dryRunInput">Enable dry run</label>

    <label for="batchSizeInput">Batch size</label>
    <input type="number" id="batchSizeInput" value="1000" />
  </div>

  <button id="importBtn" onclick="uploadFile()" class="btn btn-primary" disabled><i class="bi bi-upload"></i> Upload & Import</button>
  <button onclick="clearResult()" class="btn btn-secondary" style="margin-left:10px;">Clear</button>

  <!-- File Preview Table -->
  <div id="previewContainer" style="display:none; margin-top:20px;">
    <h6>📄 File Preview (first 5 rows)</h6>
    <div class="table-responsive">
      <table id="previewTable" class="table table-sm table-bordered table-striped">
        <thead id="previewHead"></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <div id="previewStats" class="text-muted small"></div>
  </div>

  <div id="result" class="result">
    <p class="text-muted">Ready to import...</p>
  </div>

  <div id="connectionStatus" style="margin-top:15px; font-size:14px;"></div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='js/main.js') }}"></script>
  <script src="{{ url_for('static', path='js/index.js') }}"></script>
{% endblock %}
