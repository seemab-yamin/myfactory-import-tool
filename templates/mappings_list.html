{% extends 'base.html' %}
{% block title %}
  Mappings List
{% endblock %}

{% block content %}
  <div id="listView">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-people"></i> Mappings List</h5>
        <div>
          <a href="/add-mapping" class="btn btn-sm btn-success me-2"><i class="bi bi-plus-circle"></i> Add Supplier</a>
          <button class="btn btn-sm btn-outline-primary" onclick="refreshMappings()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
      </div>
      <div class="card-body">
        <div id="mappingGrid" class="row g-3"></div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='js/mappings_list.js') }}"></script>
{% endblock %}
