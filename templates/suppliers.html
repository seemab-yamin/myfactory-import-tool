{% extends "base.html" %}
{% block title %}Suppliers{% endblock %}
{% block content %}
<div id="app">
    <!-- List View -->
    <div id="listView">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-people"></i> Suppliers</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="refreshSuppliers()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>
            <div class="card-body">
                <div id="supplierGrid" class="row g-3"></div>
            </div>
        </div>
    </div>

    <!-- Detail View -->
    <div id="detailView" style="display:none;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="showListView()">
                        <i class="bi bi-arrow-left"></i> Back
                    </button>
                    <span id="detailTitle" class="ms-3"><strong></strong></span>
                </div>
                <span class="badge bg-primary" id="detailCount">0 mappings</span>
            </div>
            <div class="card-body">
                <div id="detailContent">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let suppliers = [];

async function fetchSuppliers() {
    const r = await fetch('/api/suppliers');
    if (!r.ok) throw new Error('Failed to fetch suppliers');
    return r.json();
}

async function fetchMappings(s) {
    const r = await fetch(`/api/mappings/${s}`);
    if (!r.ok) throw new Error('Failed to fetch mappings');
    return r.json();
}

async function renderSuppliers() {
    const grid = document.getElementById('supplierGrid');
    grid.innerHTML = `
        <div class="col-12 text-center py-4">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Loading suppliers...</p>
        </div>
    `;
    try {
        const data = await fetchSuppliers();
        suppliers = data.suppliers || [];

        if (!suppliers.length) {
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <h5 class="mt-3">No suppliers found</h5>
                    <p class="text-muted">Add a mapping via CLI to create a supplier.</p>
                </div>
            `;
            return;
        }

        let html = '';
        for (const s of suppliers) {
            let cnt = 0;
            try {
                cnt = (await fetchMappings(s)).summary?.total || 0;
            } catch(e) {}
            html += `
                <div class="col-md-3 col-sm-6">
                    <a href="#" class="card h-100 text-decoration-none text-dark supplier-card" onclick="showDetail('${s}'); return false;">
                        <div class="card-body text-center">
                            <i class="bi bi-building fs-1 text-primary"></i>
                            <h5 class="card-title mt-2">${s}</h5>
                            <p class="card-text text-muted small">${cnt} mapping${cnt !== 1 ? 's' : ''}</p>
                        </div>
                    </a>
                </div>
            `;
        }
        grid.innerHTML = html;

    } catch (e) {
        grid.innerHTML = `
            <div class="col-12 text-center text-danger">
                <i class="bi bi-exclamation-triangle fs-2"></i>
                <p>Failed to load suppliers: ${e.message}</p>
                <button class="btn btn-primary btn-sm" onclick="renderSuppliers()">Retry</button>
            </div>
        `;
    }
}

async function showDetail(supplier) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('detailTitle').innerHTML = `<strong>${supplier}</strong>`;
    const content = document.getElementById('detailContent');
    const count = document.getElementById('detailCount');
    content.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Loading mappings...</p>
        </div>
    `;

    try {
        const data = await fetchMappings(supplier);
        const mappings = data.mappings || {};
        const entries = Object.entries(mappings);
        count.textContent = `${entries.length} mapping${entries.length !== 1 ? 's' : ''}`;

        if (!entries.length) {
            content.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-diagram-3 fs-1 text-muted"></i>
                    <h5 class="mt-3">No mappings for ${supplier}</h5>
                    <p class="text-muted">Add mappings using the CLI or API.</p>
                </div>
            `;
            return;
        }

        let table = `
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-light">
                        <tr>
                            <th style="width:50px;">#</th>
                            <th>Source Field</th>
                            <th style="width:40px;"></th>
                            <th>Target Field</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        entries.forEach(([src, tgt], i) => {
            table += `
                <tr>
                    <td>${i + 1}</td>
                    <td><code class="bg-light px-2 py-1 rounded">${src}</code></td>
                    <td><i class="bi bi-arrow-right text-primary"></i></td>
                    <td><code class="bg-light px-2 py-1 rounded">${tgt}</code></td>
                </tr>
            `;
        });
        table += `
                    </tbody>
                </table>
            </div>
        `;
        content.innerHTML = table;

        history.pushState({ supplier }, '', `/suppliers/${supplier}`);

    } catch (e) {
        content.innerHTML = `
            <div class="text-center text-danger py-4">
                <i class="bi bi-exclamation-triangle fs-2"></i>
                <p>Failed to load mappings: ${e.message}</p>
                <button class="btn btn-primary btn-sm" onclick="showDetail('${supplier}')">Retry</button>
            </div>
        `;
    }
}

function showListView() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
    history.pushState(null, '', '/suppliers');
}

function refreshSuppliers() {
    renderSuppliers();
}

// Browser back/forward
window.addEventListener('popstate', function(e) {
    if (e.state && e.state.supplier) {
        showDetail(e.state.supplier);
    } else {
        showListView();
    }
});

// Init
if (window.location.pathname.startsWith('/suppliers/')) {
    const s = decodeURIComponent(window.location.pathname.split('/')[2]);
    if (s) {
        document.addEventListener('DOMContentLoaded', function() {
            showDetail(s);
        });
    }
} else {
    document.addEventListener('DOMContentLoaded', renderSuppliers);
}
</script>
{% endblock %}
