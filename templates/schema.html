{% extends 'base.html' %}
{% block title %}
  Schema Viewer
{% endblock %}
{% block content %}
  <h1>📊 Database Schema</h1>
  <p class="text-muted">View column definitions for your Myfactory tables.</p>

  <div id="schemaContent">
    <div class="text-center py-4">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2">Loading schema...</p>
    </div>
  </div>
  <hr />
  <p class="text-muted small">
    Last updated: <span id="lastUpdated">Loading...</span>
  </p>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', path='js/schema.js') }}"></script>
{% endblock %}
